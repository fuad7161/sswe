<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notebound — Go Backend Engineer Roadmap</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap');

:root{
  --paper: #F4EFE1;
  --paper-dark: #E9E2CE;
  --graphite: #1A1714;
  --sepia: #5C4A32;
  --red-pen: #B33A30;
  --rule: #C9C1A8;
  --card-bg: rgba(255,255,255,0.55);
  --card-shadow: 0 2px 12px rgba(46,42,36,0.10), 0 1px 3px rgba(46,42,36,0.08);
  --sidebar-w: 280px;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 36px, var(--rule) 36px, var(--rule) 37px),
    radial-gradient(ellipse at top left, rgba(139,115,85,0.08), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(139,115,85,0.06), transparent 60%);
  color:var(--graphite);
  font-family:'Comfortaa', cursive;
  min-height:100vh;
  display:flex;
}

/* ── Margin line ── */
.margin-line{
  position:fixed; top:0; bottom:0; left:56px; width:2px;
  background:rgba(196,69,58,0.3); z-index:10;
}

/* ── Sidebar ── */
.sidebar{
  position:fixed; top:0; left:0; bottom:0;
  width:var(--sidebar-w);
  background:rgba(233,226,206,0.92);
  backdrop-filter:blur(12px);
  border-right:1px solid var(--rule);
  overflow-y:auto;
  z-index:20;
  display:flex; flex-direction:column;
  scrollbar-width:thin;
  scrollbar-color:var(--rule) transparent;
}

.sidebar-header{
  padding:28px 22px 18px;
  border-bottom:1px solid var(--rule);
  flex-shrink:0;
}
.sidebar-header h2{
  font-size:20px; font-weight:700; margin:0;
  transform:rotate(-0.5deg);
}
.sidebar-header .subtitle{
  font-size:12px; color:var(--sepia); margin-top:4px;
}

.sidebar-links{
  display:flex; gap:8px; margin-top:12px;
}
.sidebar-links a{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; color:var(--sepia); text-decoration:none;
  padding:4px 10px; border-radius:6px;
  background:rgba(139,115,85,0.06);
  border:1px solid rgba(46,42,36,0.08);
  transition:all 0.15s ease;
  font-family:'Comfortaa',cursive;
}
.sidebar-links a:hover{
  color:var(--red-pen); background:rgba(179,58,48,0.06);
  border-color:var(--red-pen);
}
.sidebar-links a svg{width:12px; height:12px;}

/* progress bar in sidebar header */
.sidebar-progress-wrap{
  margin-top:12px;
}
.sidebar-progress-bar{
  width:100%; height:6px; background:var(--paper-dark);
  border-radius:3px; overflow:hidden;
}
.sidebar-progress-fill{
  height:100%; background:var(--red-pen);
  border-radius:3px; transition:width 0.3s ease;
}
.sidebar-progress-text{
  font-size:11px; color:var(--sepia); margin-top:4px;
}

.sidebar-nav{
  flex:1; padding:12px 0;
}

.level-group{margin-bottom:2px;}

.level-btn{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; border:none; background:none; cursor:pointer;
  font-family:'Comfortaa',cursive; font-size:12px; font-weight:700;
  color:var(--sepia); padding:8px 18px;
  text-align:left; transition:all 0.15s ease;
  letter-spacing:0.3px;
}
.level-btn:hover{background:rgba(139,115,85,0.08); color:var(--graphite);}
.level-btn.active{color:var(--red-pen); background:rgba(179,58,48,0.06);}
.level-btn .chevron{
  font-size:10px; transition:transform 0.15s ease;
}
.level-group.open .level-btn .chevron{transform:rotate(90deg);}

.level-items{
  max-height:0; overflow:hidden; transition:max-height 0.25s ease;
}
.level-group.open .level-items{max-height:2000px;}

.nav-item{
  display:flex; align-items:center; justify-content:space-between;
  width:100%;
  border:none; background:none; cursor:pointer;
  font-family:'Comfortaa',cursive; font-size:11px;
  color:var(--graphite); padding:5px 18px 5px 32px;
  text-align:left; transition:all 0.15s ease;
  text-decoration:none;
  border-left:3px solid transparent;
}
.nav-item:hover{
  background:rgba(139,115,85,0.06);
  border-left-color:var(--rule);
}
.nav-item.active{
  color:var(--red-pen); font-weight:600;
  background:rgba(179,58,48,0.05);
  border-left-color:var(--red-pen);
}

.nav-count{
  font-size:9px; color:var(--sepia);
  background:var(--paper-dark); padding:1px 5px;
  border-radius:8px; font-weight:600;
  flex-shrink:0;
}
.nav-count.complete{background:rgba(179,58,48,0.12); color:var(--red-pen);}

/* ── Main content ── */
.main{
  margin-left:var(--sidebar-w);
  flex:1; padding:36px 44px 80px 72px;
  max-width:900px;
}

.main-header{
  margin-bottom:32px;
}
.main-header .eyebrow{
  font-size:14px; color:var(--sepia); letter-spacing:1px;
  transform:rotate(-1deg); display:inline-block; margin-bottom:4px;
}
.main-header h1{
  font-family:'Comfortaa',cursive; font-weight:700;
  font-size:36px; line-height:1.1; margin:0 0 6px;
}
.main-header .underline-scribble{position:relative; display:inline-block;}
.main-header .underline-scribble svg{position:absolute; left:0; bottom:-6px; width:100%; height:12px;}
.main-header .stats{
  font-size:14px; color:var(--sepia); margin-top:8px;
}
.main-header .stats b{color:var(--graphite);}

/* ── Section cards (chapters) ── */
.section-card{
  margin-bottom:16px;
  scroll-margin-top:24px;
}

.section-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; cursor:pointer; background:var(--card-bg);
  border:1px solid rgba(46,42,36,0.10);
  border-radius:10px;
  box-shadow:var(--card-shadow);
  font-family:'Comfortaa',cursive; font-size:17px; color:var(--graphite);
  text-align:left; transition:all 0.2s ease;
  width:100%; border-bottom:none;
  user-select:none;
}
.section-card.open .section-head{
  border-radius:10px 10px 0 0;
  border-bottom:1px solid rgba(46,42,36,0.08);
}
.section-head:hover{
  box-shadow:0 6px 24px rgba(46,42,36,0.13), 0 2px 6px rgba(46,42,36,0.08);
  transform:translateY(-1px);
}

.section-title{display:flex; align-items:center; gap:10px;}
.tab{
  display:inline-block; background:var(--paper-dark); border:1px solid rgba(46,42,36,0.18);
  font-size:12px; font-family:'Comfortaa',cursive; color:var(--graphite);
  padding:2px 9px; transform:rotate(-2deg); border-radius:4px;
  flex-shrink:0;
}
.section-title-text{font-weight:600; font-size:16px;}

.section-meta{display:flex; align-items:center; gap:10px;}
.section-resource-link{
  display:inline-flex; align-items:center; gap:4px;
  font-family:'Comfortaa',cursive; font-size:11px; font-weight:600;
  color:var(--sepia); text-decoration:none;
  padding:3px 10px; border-radius:5px;
  background:rgba(139,115,85,0.06);
  border:1px solid rgba(46,42,36,0.10);
  transition:all 0.15s ease;
  white-space:nowrap;
}
.section-resource-link:hover{
  color:var(--red-pen); background:rgba(179,58,48,0.06);
  border-color:rgba(179,58,48,0.25);
  transform:translateY(-1px);
}
.section-resource-link svg{width:12px; height:12px;}
.section-progress{font-size:13px; color:var(--sepia); white-space:nowrap; font-weight:600;}
.section-progress.complete{color:var(--red-pen);}
.s-chevron{transition:transform 0.15s ease; color:var(--sepia); font-size:14px;}
.section-card.open .s-chevron{transform:rotate(90deg);}

.section-body{
  max-height:0; overflow:hidden; transition:max-height 0.3s ease;
  background:var(--card-bg);
  border:1px solid rgba(46,42,36,0.10);
  border-top:none;
  border-radius:0 0 10px 10px;
  box-shadow:0 2px 12px rgba(46,42,36,0.06);
}
.section-card.open .section-body{max-height:30000px;}

.section-body-inner{
  padding:14px 18px 20px;
}

/* ── Topic groups inside a section ── */
.topic-block{
  margin-bottom:16px;
  scroll-margin-top:20px;
}
.topic-block:last-child{margin-bottom:0;}

.topic-title{
  font-size:14px; font-weight:700; color:var(--graphite);
  margin:0 0 8px 0; transform:rotate(-0.3deg);
  display:flex; align-items:center; gap:8px;
}
.topic-title svg{width:15px; height:15px; color:var(--red-pen); flex-shrink:0;}

/* ── Items: compact copyable tags ── */
.items-wrap{
  display:flex; flex-wrap:wrap; gap:6px;
}

.item-tag{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 12px;
  background:rgba(255,255,255,0.6);
  border:1px solid rgba(46,42,36,0.10);
  border-radius:6px;
  font-size:13px; color:var(--graphite);
  cursor:pointer;
  transition:all 0.15s ease;
  line-height:1.3;
  user-select:none;
  position:relative;
}
.item-tag:hover{
  background:var(--paper-dark);
  border-color:rgba(179,58,48,0.25);
  transform:translateY(-1px);
  box-shadow:0 2px 8px rgba(46,42,36,0.08);
}
.item-tag.done{
  background:rgba(179,58,48,0.04);
  border-color:rgba(179,58,48,0.15);
}
.item-tag.done .item-label{
  color:var(--sepia);
  text-decoration:line-through;
  text-decoration-color:var(--red-pen);
  text-decoration-thickness:2px;
}

.item-check{
  width:14px; height:14px; border:2px solid var(--graphite);
  flex-shrink:0; position:relative; border-radius:2px;
  transition:all 0.15s ease;
}
.item-tag.done .item-check{
  border-color:var(--red-pen);
  background:rgba(179,58,48,0.08);
}
.item-tag.done .item-check::after{
  content:''; position:absolute; left:1px; top:4px; width:8px; height:4px;
  border-left:2px solid var(--red-pen); border-bottom:2px solid var(--red-pen);
  transform:rotate(-45deg);
}

.item-label{
  font-size:13px; color:var(--graphite);
  transition:color 0.15s;
}

/* Copy button on item */
.item-copy{
  display:none; /* shown on hover */
  width:14px; height:14px; flex-shrink:0;
  color:var(--sepia); opacity:0.6;
  transition:opacity 0.15s, color 0.15s;
  cursor:pointer;
}
.item-tag:hover .item-copy{display:block;}
.item-copy:hover{opacity:1; color:var(--red-pen);}

/* Copy toast */
.copy-toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--graphite); color:var(--paper);
  padding:8px 20px; border-radius:8px; font-size:13px;
  font-family:'Comfortaa',cursive;
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
  opacity:0; transition:all 0.25s ease;
  z-index:100; pointer-events:none;
}
.copy-toast.show{
  opacity:1; transform:translateX(-50%) translateY(0);
}

/* ── Divider ── */
.level-divider{
  border:none; border-top:1px dashed var(--rule);
  margin:28px 0;
}

/* ── Mobile ── */
@media (max-width:768px){
  .sidebar{
    position:relative; width:100%;
    border-right:none; border-bottom:1px solid var(--rule);
    max-height:none;
  }
  .main{
    margin-left:0; padding:24px 18px 60px;
  }
  body{flex-direction:column;}
  .margin-line{display:none;}

  .sidebar.collapsed .sidebar-nav{display:none;}
  .sidebar-toggle{
    display:flex; align-items:center; gap:6px;
    border:none; background:none; cursor:pointer;
    font-family:'Comfortaa',cursive; font-size:12px;
    color:var(--sepia); padding:8px 22px;
    border-top:1px solid var(--rule);
    width:100%;
  }
  .section-head{font-size:15px;}
  .item-tag{font-size:12px; padding:4px 10px;}
}
@media (min-width:769px){
  .sidebar-toggle{display:none;}
}
</style>
</head>

        { title: 'Project 2 — Distributed Notification System', items: ['Go API','Kafka','Worker Services','Retry Mechanism','Dead Letter Queue','Idempotency','Redis','PostgreSQL','Distributed Tracing','Metrics','Docker','Kubernetes'] },
        { title: 'Project 3 — Distributed Job Queue', items: ['Job Producer','Job Consumer','Worker Pool','Retry','Dead Letter Queue','Job Scheduling','Priority Queue','Redis','PostgreSQL','Kafka or RabbitMQ','Monitoring'] },
        { title: 'Project 4 — High-Scale URL Shortener', items: ['REST API','PostgreSQL','Redis','Distributed ID Generation','Caching','Rate Limiting','Load Balancing','Horizontal Scaling','Docker','Kubernetes','Monitoring'] },
        { title: 'Project 5 — Real-Time Chat System', items: ['WebSockets','Go','Redis','Kafka','PostgreSQL','Presence System','Message Delivery','Offline Messages','Message Ordering','Horizontal Scaling'] }

    },
    {
      id: 's28',
      title: '28 — Final Senior Engineer Checklist',
      topics: [
        { title: 'Final Checklist', items: ['I can write production-quality Go','I understand Go concurrency deeply','I can design REST APIs','I can design gRPC services','I understand TCP, HTTP, DNS, and TLS','I can design PostgreSQL schemas','I can optimize slow SQL queries','I understand Redis deeply','I understand Kafka or another message broker','I understand distributed systems','I can design scalable systems','I can build microservices','I can use Docker','I can deploy applications to Kubernetes','I can deploy applications to AWS','I can build CI/CD pipelines','I can monitor production systems','I can debug production incidents','I understand security fundamentals','I write unit and integration tests','I can perform performance optimization','I can review code','I can make architectural trade-offs','I can mentor other engineers','I can lead technical projects'] }
      ]
    }
  ];

  // Map section IDs to resource page anchors (category name slugified)
  const sectionResources = {
    's1': 'core-go',
    's2': 'core-go',
    's3': null,
    's4': 'linux',
    's5': null,
    's6': null,
    's7': null,
    's8': 'postgresql-pgx-sqlc',
    's9': 'redis',
    's10': 'redis',
    's11': 'kafka',
    's12': 'distributed-systems',
    's13': 'system-design',
    's14': 'microservices',
    's15': 'microservices',
    's16': 'docker',
    's17': 'kubernetes',
    's18': 'aws',
    's19': 'ci-cd',
    's20': 'observability',
    's21': null,
    's22': 'testing',
    's23': 'performance-engineering',
    's24': 'distributed-databases',
    's25': null,
    's26': null,
    's27': null,
    's28': null
  };

  const STORAGE_KEY = 'notebound-checklist-progress';
  let checked = {};
  try { checked = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { checked = {}; }

  let openSections = {};
  let openSidebar = {};
  data.forEach((_, i) => openSidebar[i] = false);

  // Open first section by default
  if(data.length) openSections[data[0].id] = true;

  function itemKey(sectionId, topicIdx, itemIdx){
    return sectionId + '__' + topicIdx + '__' + itemIdx;
  }

  function countSection(section){
    let total = 0, done = 0;
    section.topics.forEach((t, ti) => {
      t.items.forEach((_, ii) => {
        total++;
        if(checked[itemKey(section.id, ti, ii)]) done++;
      });
    });
    return { total, done };
  }

  function countTopic(section, topicIdx){
    let total = 0, done = 0;
    section.topics[topicIdx].items.forEach((_, ii) => {
      total++;
      if(checked[itemKey(section.id, topicIdx, ii)]) done++;
    });
    return { total, done };
  }

  function countAll(){
    let total = 0, done = 0;
    data.forEach(s => { const c = countSection(s); total += c.total; done += c.done; });
    return { total, done };
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(checked));
  }

  // Topic icon svg
  const topicSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

  // Copy icon svg
  const copySvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  // Resource link icon
  const resourceSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

  function showToast(text){
    const toast = document.getElementById('copy-toast');
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function copyText(text, e){
    e.stopPropagation();
    navigator.clipboard.writeText(text).then(() => {
      showToast('Copied: ' + text);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied: ' + text);
    });
  }

  function buildSidebar(){
    const sidebarNav = document.getElementById('sidebar-nav');
    sidebarNav.innerHTML = '';

    data.forEach((section, si) => {
      const { total, done } = countSection(section);
      const group = document.createElement('div');
      group.className = 'level-group' + (openSidebar[si] ? ' open' : '');

      const btn = document.createElement('button');
      btn.className = 'level-btn';
      const numPart = section.title.split('—')[0].trim();
      const namePart = section.title.split('—')[1] ? section.title.split('—')[1].trim() : '';
      btn.innerHTML = `<span>${numPart} — ${namePart}</span> <span style="display:flex;align-items:center;gap:6px;"><span class="nav-count${done===total?' complete':''}">${done}/${total}</span><span class="chevron">▸</span></span>`;
      btn.onclick = (e) => {
        e.stopPropagation();
        openSidebar[si] = !openSidebar[si];
        buildSidebar();
      };
      // Also click to scroll to section
      btn.ondblclick = () => {
        const target = document.getElementById(`section-${section.id}`);
        if(target){
          if(!openSections[section.id]){
            openSections[section.id] = true;
            buildContent();
          }
          setTimeout(() => target.scrollIntoView({ behavior:'smooth', block:'start' }), 50);
        }
      };
      group.appendChild(btn);

      const items = document.createElement('div');
      items.className = 'level-items';
      section.topics.forEach((topic, ti) => {
        const { total: tt, done: td } = countTopic(section, ti);
        const navItem = document.createElement('button');
        navItem.className = 'nav-item';
        navItem.innerHTML = `<span>${topic.title}</span> <span class="nav-count${td===tt?' complete':''}">${td}/${tt}</span>`;
        navItem.onclick = () => {
          // open section if closed
          if(!openSections[section.id]){
            openSections[section.id] = true;
            buildContent();
          }
          setTimeout(() => {
            const target = document.getElementById(`topic-${section.id}-${ti}`);
            if(target){
              target.scrollIntoView({ behavior:'smooth', block:'center' });
              target.style.background = 'rgba(179,58,48,0.06)';
              target.style.borderRadius = '8px';
              setTimeout(() => { target.style.background = ''; target.style.borderRadius = ''; }, 1500);
            }
            // set active
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navItem.classList.add('active');
          }, 100);
        };
        items.appendChild(navItem);
      });
      group.appendChild(items);
      sidebarNav.appendChild(group);
    });
  }

  function buildContent(){
    const content = document.getElementById('content');
    content.innerHTML = '';

    data.forEach((section, si) => {
      const { total, done } = countSection(section);
      const isOpen = !!openSections[section.id];

      const card = document.createElement('div');
      card.className = 'section-card' + (isOpen ? ' open' : '');
      card.id = `section-${section.id}`;

      // Head
      const head = document.createElement('div');
      head.className = 'section-head';
      const numPart = section.title.split('—')[0].trim();
      const namePart = section.title.split('—')[1] ? section.title.split('—')[1].trim() : '';
      const resAnchor = sectionResources[section.id];
      const resLink = resAnchor ? `<a href="resources.html#${resAnchor}" class="section-resource-link" onclick="event.stopPropagation()">${resourceSvg} Resources</a>` : '';
      head.innerHTML = `
        <span class="section-title"><span class="tab">${numPart}</span><span class="section-title-text">${namePart}</span></span>
        <span class="section-meta">
          ${resLink}
          <span class="section-progress${done===total?' complete':''}">${done} / ${total}</span>
          <span class="s-chevron">▸</span>
        </span>
      `;
      head.onclick = () => {
        openSections[section.id] = !isOpen;
        buildContent();
      };
      card.appendChild(head);

      // Body
      const body = document.createElement('div');
      body.className = 'section-body';
      const bodyInner = document.createElement('div');
      bodyInner.className = 'section-body-inner';

      section.topics.forEach((topic, ti) => {
        const block = document.createElement('div');
        block.className = 'topic-block';
        block.id = `topic-${section.id}-${ti}`;

        const title = document.createElement('h3');
        title.className = 'topic-title';
        title.innerHTML = `${topicSvg} ${topic.title}`;
        block.appendChild(title);

        const wrap = document.createElement('div');
        wrap.className = 'items-wrap';

        topic.items.forEach((itemText, ii) => {
          const key = itemKey(section.id, ti, ii);
          const isDone = !!checked[key];

          const tag = document.createElement('div');
          tag.className = 'item-tag' + (isDone ? ' done' : '');

          // Checkbox
          const chk = document.createElement('span');
          chk.className = 'item-check';

          // Label
          const label = document.createElement('span');
          label.className = 'item-label';
          label.textContent = itemText;

          // Copy button
          const copyBtn = document.createElement('span');
          copyBtn.className = 'item-copy';
          copyBtn.innerHTML = copySvg;
          copyBtn.title = 'Copy to clipboard';
          copyBtn.onclick = (e) => copyText(itemText, e);

          tag.appendChild(chk);
          tag.appendChild(label);
          tag.appendChild(copyBtn);

          // Click tag to toggle done
          tag.onclick = () => {
            checked[key] = !isDone;
            save();
            render();
          };

          wrap.appendChild(tag);
        });

        block.appendChild(wrap);
        bodyInner.appendChild(block);
      });

      body.appendChild(bodyInner);
      card.appendChild(body);
      content.appendChild(card);
    });
  }

  function updateStats(){
    const overall = countAll();
    const pct = overall.total ? Math.round((overall.done / overall.total) * 100) : 0;
    document.getElementById('sidebar-stats').textContent = `${data.length} sections · ${overall.total} topics`;
    document.getElementById('main-stats').innerHTML = `<b>${overall.done}</b> of <b>${overall.total}</b> topics mastered · <b>${pct}%</b> complete`;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${overall.done} / ${overall.total} done (${pct}%)`;
  }

  function render(){
    buildSidebar();
    buildContent();
    updateStats();
  }

  render();

  // ── Mobile toggle ──
  const toggleBtn = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  if(toggleBtn){
    toggleBtn.onclick = () => sidebar.classList.toggle('collapsed');
  }

  // ── Scroll spy for active nav ──
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const id = entry.target.id;
        // topic-sX-Y
        if(id.startsWith('topic-')){
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          const parts = id.replace('topic-','').split('-');
          const sectionId = parts[0];
          const topicIdx = parseInt(parts[1]);
          let idx = 0;
          for(let i = 0; i < data.length; i++){
            if(data[i].id === sectionId) break;
            idx += data[i].topics.length;
          }
          idx += topicIdx;
          const navItems = document.querySelectorAll('.nav-item');
          if(navItems[idx]) navItems[idx].classList.add('active');
        }
      }
    });
  }, { threshold: 0.3 });

  // Observe topic blocks after render
  const observeTopics = () => {
    document.querySelectorAll('.topic-block').forEach(block => observer.observe(block));
  };
  observeTopics();

  // Re-observe on content rebuild
  const origBuildContent = buildContent;
  buildContent = function(){
    origBuildContent();
    observeTopics();
  };

})();
</script>
