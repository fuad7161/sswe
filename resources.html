<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notebound — Learning Resources</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap');

:root{
  --paper: #F4EFE1;
  --paper-dark: #E9E2CE;
  --graphite: #1A1714;
  --sepia: #5C4A32;
  --red-pen: #B33A30;
  --rule: #C9C1A8;
  --card-bg: rgba(255,255,255,0.55);
  --card-shadow: 0 2px 12px rgba(46,42,36,0.10), 0 1px 3px rgba(46,42,36,0.08);
  --sidebar-w: 280px;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 36px, var(--rule) 36px, var(--rule) 37px),
    radial-gradient(ellipse at top left, rgba(139,115,85,0.08), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(139,115,85,0.06), transparent 60%);
  color:var(--graphite);
  font-family:'Comfortaa', cursive;
  min-height:100vh;
  display:flex;
}

/* ── Margin line ── */
.margin-line{
  position:fixed; top:0; bottom:0; left:56px; width:2px;
  background:rgba(196,69,58,0.3); z-index:10;
}

/* ── Sidebar ── */
.sidebar{
  position:fixed; top:0; left:0; bottom:0;
  width:var(--sidebar-w);
  background:rgba(233,226,206,0.92);
  backdrop-filter:blur(12px);
  border-right:1px solid var(--rule);
  overflow-y:auto;
  z-index:20;
  display:flex; flex-direction:column;
  scrollbar-width:thin;
  scrollbar-color:var(--rule) transparent;
}

.sidebar-header{
  padding:28px 22px 18px;
  border-bottom:1px solid var(--rule);
  flex-shrink:0;
}
.sidebar-header .back-link{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; color:var(--sepia); text-decoration:none;
  letter-spacing:0.5px; transition:color 0.15s;
}
.sidebar-header .back-link:hover{color:var(--red-pen);}
.sidebar-header .back-link svg{width:14px; height:14px;}
.sidebar-header h2{
  font-size:20px; font-weight:700; margin:12px 0 0;
  transform:rotate(-0.5deg);
}
.sidebar-header .subtitle{
  font-size:12px; color:var(--sepia); margin-top:4px;
}

.sidebar-nav{
  flex:1; padding:12px 0;
}

.level-group{margin-bottom:4px;}

.level-btn{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; border:none; background:none; cursor:pointer;
  font-family:'Comfortaa',cursive; font-size:13px; font-weight:700;
  color:var(--sepia); padding:10px 20px;
  text-align:left; transition:all 0.15s ease;
  letter-spacing:0.3px;
}
.level-btn:hover{background:rgba(139,115,85,0.08); color:var(--graphite);}
.level-btn.active{color:var(--red-pen); background:rgba(179,58,48,0.06);}
.level-btn .chevron{
  font-size:11px; transition:transform 0.15s ease;
}
.level-group.open .level-btn .chevron{transform:rotate(90deg);}

.level-items{
  max-height:0; overflow:hidden; transition:max-height 0.25s ease;
}
.level-group.open .level-items{max-height:600px;}

.nav-item{
  display:block; width:100%;
  border:none; background:none; cursor:pointer;
  font-family:'Comfortaa',cursive; font-size:12px;
  color:var(--graphite); padding:7px 20px 7px 36px;
  text-align:left; transition:all 0.15s ease;
  text-decoration:none;
  border-left:3px solid transparent;
}
.nav-item:hover{
  background:rgba(139,115,85,0.06);
  border-left-color:var(--rule);
}
.nav-item.active{
  color:var(--red-pen); font-weight:600;
  background:rgba(179,58,48,0.05);
  border-left-color:var(--red-pen);
}

.nav-count{
  display:inline-block;
  font-size:10px; color:var(--sepia);
  background:var(--paper-dark); padding:1px 6px;
  border-radius:8px; margin-left:6px;
  font-weight:600;
}

/* ── Main content ── */
.main{
  margin-left:var(--sidebar-w);
  flex:1; padding:40px 48px 80px 80px;
  max-width:860px;
}

.main-header{
  margin-bottom:36px;
}
.main-header .eyebrow{
  font-size:14px; color:var(--sepia); letter-spacing:1px;
  transform:rotate(-1deg); display:inline-block; margin-bottom:4px;
}
.main-header h1{
  font-family:'Comfortaa',cursive; font-weight:700;
  font-size:36px; line-height:1.1; margin:0 0 6px;
}
.main-header .underline-scribble{position:relative; display:inline-block;}
.main-header .underline-scribble svg{position:absolute; left:0; bottom:-6px; width:100%; height:12px;}
.main-header .stats{
  font-size:14px; color:var(--sepia); margin-top:8px;
}
.main-header .stats b{color:var(--graphite);}

/* ── Category sections ── */
.level-section{
  margin-bottom:40px;
  scroll-margin-top:24px;
}
.level-title{
  font-size:22px; font-weight:700; color:var(--graphite);
  margin:0 0 6px; transform:rotate(-0.4deg);
  display:flex; align-items:center; gap:10px;
}
.level-title .level-badge{
  font-size:11px; background:var(--red-pen); color:#fff;
  padding:3px 10px; border-radius:4px; font-weight:700;
  transform:rotate(-2deg);
}
.level-desc{
  font-size:13px; color:var(--sepia); margin:0 0 18px;
}

.category-card{
  background:var(--card-bg);
  border:1px solid rgba(46,42,36,0.10);
  border-radius:12px;
  box-shadow:var(--card-shadow);
  padding:20px 24px;
  margin-bottom:14px;
  transition:box-shadow 0.2s ease, transform 0.2s ease;
  scroll-margin-top:20px;
}
.category-card:hover{
  box-shadow:0 6px 24px rgba(46,42,36,0.13), 0 2px 6px rgba(46,42,36,0.08);
  transform:translateY(-1px);
}
.category-card.highlight{
  border-left:3px solid var(--red-pen);
  background:rgba(255,255,255,0.7);
}

.category-name{
  font-size:17px; font-weight:700; color:var(--graphite);
  margin:0 0 14px; transform:rotate(-0.3deg);
  display:flex; align-items:center; gap:8px;
}
.category-name svg{width:18px; height:18px; color:var(--red-pen); flex-shrink:0;}

.resource-list{list-style:none; padding:0; margin:0;}

.resource-item{
  margin-bottom:10px;
}
.resource-item:last-child{margin-bottom:0;}

.resource-link{
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 14px;
  background:rgba(255,255,255,0.5);
  border:1px solid rgba(46,42,36,0.08);
  border-radius:8px;
  text-decoration:none;
  color:var(--graphite);
  transition:all 0.15s ease;
  font-size:14px; line-height:1.4;
}
.resource-link:hover{
  background:var(--paper-dark);
  border-color:var(--red-pen);
  transform:translateX(4px);
  box-shadow:0 2px 8px rgba(179,58,48,0.08);
}

.resource-link .icon{
  width:32px; height:32px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(179,58,48,0.08); border-radius:6px;
  color:var(--red-pen);
}
.resource-link .icon svg{width:16px; height:16px;}

.resource-info{flex:1; min-width:0;}
.resource-title{
  font-weight:600; font-size:14px; color:var(--graphite);
  margin-bottom:2px;
}
.resource-link:hover .resource-title{color:var(--red-pen);}

.resource-type{
  font-size:11px; font-weight:600; letter-spacing:0.3px;
  padding:2px 7px; border-radius:3px; display:inline-block;
}
.resource-type.web{background:rgba(59,130,246,0.12); color:#2563eb;}
.resource-type.video{background:rgba(239,68,68,0.12); color:#dc2626;}
.resource-type.book{background:rgba(139,92,246,0.12); color:#7c3aed;}
.resource-type.github{background:rgba(24,24,27,0.10); color:#18181b;}
.resource-type.docs{background:rgba(16,185,129,0.12); color:#059669;}
.resource-type.course{background:rgba(245,158,11,0.12); color:#d97706;}

.resource-link .arrow{
  width:16px; height:16px; flex-shrink:0;
  color:var(--sepia); opacity:0;
  transition:opacity 0.15s, transform 0.15s;
  align-self:center;
}
.resource-link:hover .arrow{opacity:1; transform:translateX(2px);}

.book-card{
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 14px;
  background:rgba(139,92,246,0.04);
  border:1px dashed rgba(124,58,237,0.25);
  border-radius:8px;
  font-size:14px; line-height:1.4;
  color:var(--graphite);
}
.book-card .icon{
  width:32px; height:32px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(139,92,246,0.10); border-radius:6px;
  color:#7c3aed;
}
.book-card .icon svg{width:16px; height:16px;}

/* ── Divider ── */
.level-divider{
  border:none; border-top:1px dashed var(--rule);
  margin:32px 0;
}

/* ── Mobile ── */
@media (max-width:768px){
  .sidebar{
    position:relative; width:100%;
    border-right:none; border-bottom:1px solid var(--rule);
    max-height:none;
  }
  .main{
    margin-left:0; padding:28px 20px 60px;
  }
  body{flex-direction:column;}
  .margin-line{display:none;}

  .sidebar.collapsed .sidebar-nav{display:none;}
  .sidebar-toggle{
    display:flex; align-items:center; gap:6px;
    border:none; background:none; cursor:pointer;
    font-family:'Comfortaa',cursive; font-size:12px;
    color:var(--sepia); padding:8px 22px;
    border-top:1px solid var(--rule);
    width:100%;
  }
}
@media (min-width:769px){
  .sidebar-toggle{display:none;}
}
</style>
</head>
<body>
<div class="margin-line"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to checklist
    </a>
    <h2>📚 Resources</h2>
    <p class="subtitle" id="stats"></p>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <button class="sidebar-toggle" id="sidebar-toggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    Toggle categories
  </button>
</aside>

<main class="main" id="main-content">
  <div class="main-header">
    <span class="eyebrow">curated links, books &amp; courses</span>
    <h1>
      <span class="underline-scribble">
        Learning Resources
        <svg viewBox="0 0 260 12" preserveAspectRatio="none"><path d="M2,7 Q60,2 130,7 T258,6" stroke="#C4453A" stroke-width="3" fill="none"/></svg>
      </span>
    </h1>
    <p class="stats" id="main-stats"></p>
  </div>
  <div id="content"></div>
</main>

<script>
(function(){

  const data = [
    {
      level: 'Level 1',
      title: 'Go Backend',
      desc: 'Core language, database, caching & testing fundamentals',
      categories: [
        { name: 'Core Go', items: [
          { title: 'Go by Example', url: 'https://gobyexample.com/', type: 'web' },
          { title: 'Effective Go (official)', url: 'https://go.dev/doc/effective_go', type: 'docs' },
          { title: 'Learning Go by Jon Bodner', url: null, type: 'book' },
          { title: 'Go Concurrency Patterns — Rob Pike', url: 'https://www.youtube.com/watch?v=f6kdp27TYZs', type: 'video' }
        ]},
        { name: 'Advanced / Performance', items: [
          { title: 'Ardan Labs Go Training (free, GitHub)', url: 'https://github.com/ardanlabs/gotraining', type: 'github' },
          { title: "Julia Evans' Blog", url: 'https://jvns.ca/', type: 'web' },
          { title: "Dave Cheney's Blog", url: 'https://dave.cheney.net/', type: 'web' },
          { title: 'Go pprof Official Blog Post', url: 'https://go.dev/blog/pprof', type: 'docs' }
        ]},
        { name: 'PostgreSQL + pgx + sqlc', items: [
          { title: 'sqlc Documentation', url: 'https://docs.sqlc.dev/', type: 'docs' },
          { title: 'pgx (GitHub)', url: 'https://github.com/jackc/pgx', type: 'github' },
          { title: 'Use The Index, Luke', url: 'https://use-the-index-luke.com/', type: 'web' }
        ]},
        { name: 'Redis', items: [
          { title: 'Redis University (free courses)', url: 'https://university.redis.com/', type: 'course' }
        ]},
        { name: 'Testing', items: [
          { title: 'testcontainers-go Documentation', url: 'https://golang.testcontainers.org/', type: 'docs' },
          { title: 'Testify (GitHub)', url: 'https://github.com/stretchr/testify', type: 'github' }
        ]}
      ]
    },
    {
      level: 'Level 2',
      title: 'Production Engineering',
      desc: 'Infrastructure, deployment & monitoring at scale',
      categories: [
        { name: 'Docker', items: [
          { title: 'Docker Multi-Stage Builds Guide', url: 'https://docs.docker.com/build/building/multi-stage/', type: 'docs' }
        ]},
        { name: 'Linux', items: [
          { title: 'Wizard Zines — Julia Evans', url: 'https://wizardzines.com/', type: 'web' },
          { title: 'Brendan Gregg — Linux Performance', url: 'https://www.brendangregg.com/linuxperf.html', type: 'web' }
        ]},
        { name: 'CI/CD', items: [
          { title: 'GitHub Actions Documentation', url: 'https://docs.github.com/en/actions', type: 'docs' },
          { title: 'GitHub Actions for Go — Example Workflows', url: 'https://github.com/mvdan/github-actions-golang', type: 'github' }
        ]},
        { name: 'AWS', items: [
          { title: 'AWS Skill Builder (free tier)', url: 'https://skillbuilder.aws/', type: 'course' }
        ]},
        { name: 'Observability', items: [
          { title: 'Prometheus Documentation', url: 'https://prometheus.io/docs/introduction/overview/', type: 'docs' },
          { title: 'Grafana Tutorials', url: 'https://grafana.com/tutorials/', type: 'docs' },
          { title: 'OpenTelemetry — Go Docs', url: 'https://opentelemetry.io/docs/languages/go/', type: 'docs' }
        ]}
      ]
    },
    {
      level: 'Level 3',
      title: 'Senior Architecture',
      desc: 'Distributed systems, design patterns & orchestration',
      categories: [
        { name: 'Kafka', items: [
          { title: 'Confluent Developer — Free Kafka Courses', url: 'https://developer.confluent.io/courses/', type: 'course' },
          { title: 'Kafka: The Definitive Guide (free PDF from Confluent)', url: null, type: 'book' }
        ]},
        { name: 'Distributed Systems', items: [
          { title: 'MIT 6.824 Distributed Systems (free, labs in Go)', url: 'https://pdos.csail.mit.edu/6.824/', type: 'course' },
          { title: 'Designing Data-Intensive Applications by Martin Kleppmann', url: null, type: 'book' }
        ]},
        { name: 'System Design', items: [
          { title: 'systemdesign.one', url: 'https://systemdesign.one/', type: 'web' },
          { title: 'ByteByteGo (YouTube)', url: 'https://www.youtube.com/@ByteByteGo', type: 'video' },
          { title: 'Excalidraw (for diagramming designs)', url: 'https://excalidraw.com/', type: 'web' }
        ]},
        { name: 'Microservices', items: [
          { title: 'microservices.io — Chris Richardson', url: 'https://microservices.io/', type: 'web' }
        ]},
        { name: 'Kubernetes', items: [
          { title: 'Kubernetes Official Tutorials', url: 'https://kubernetes.io/docs/tutorials/', type: 'docs' },
          { title: 'Killercoda — Free Interactive K8s Scenarios', url: 'https://killercoda.com/', type: 'course' }
        ]}
      ]
    },
    {
      level: 'Level 4',
      title: 'Advanced Specialization',
      desc: 'Performance, databases & cloud at expert level',
      categories: [
        { name: 'Performance Engineering', items: [
          { title: 'Go pprof Guide', url: 'https://go.dev/blog/pprof', type: 'docs' },
          { title: 'Systems Performance by Brendan Gregg', url: null, type: 'book' }
        ]},
        { name: 'Distributed Databases', items: [
          { title: 'CMU Database Group Lectures (YouTube)', url: 'https://www.youtube.com/@cmudatabasegroup', type: 'video' }
        ]},
        { name: 'Cloud Architecture', items: [
          { title: 'AWS Architecture Center', url: 'https://aws.amazon.com/architecture/', type: 'docs' }
        ]},
        { name: 'High-Scale / Load Testing', items: [
          { title: 'k6 Documentation', url: 'https://k6.io/docs/', type: 'docs' }
        ]}
      ]
    }
  ];

  // Icons for resource types
  const typeIcons = {
    web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    docs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>',
    video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    github: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>',
    course: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>'
  };

  const typeLabels = {
    web: 'WEB', docs: 'DOCS', video: 'VIDEO',
    book: 'BOOK', github: 'GITHUB', course: 'COURSE'
  };

  const arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  const categorySvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

  // Count totals
  let totalResources = 0;
  let totalCategories = 0;
  data.forEach(l => {
    l.categories.forEach(c => {
      totalCategories++;
      totalResources += c.items.length;
    });
  });

  document.getElementById('stats').textContent = `${data.length} levels · ${totalCategories} categories`;
  document.getElementById('main-stats').innerHTML = `<b>${totalResources}</b> resources across <b>${data.length}</b> levels and <b>${totalCategories}</b> categories`;

  // ── Build sidebar ──
  const sidebarNav = document.getElementById('sidebar-nav');
  let openLevels = {};
  data.forEach((_, i) => openLevels[i] = true); // all open by default

  function buildSidebar(){
    sidebarNav.innerHTML = '';
    data.forEach((level, li) => {
      const group = document.createElement('div');
      group.className = 'level-group' + (openLevels[li] ? ' open' : '');

      const btn = document.createElement('button');
      btn.className = 'level-btn';
      btn.innerHTML = `${level.level} — ${level.title} <span class="chevron">▸</span>`;
      btn.onclick = () => { openLevels[li] = !openLevels[li]; buildSidebar(); };
      group.appendChild(btn);

      const items = document.createElement('div');
      items.className = 'level-items';
      level.categories.forEach((cat, ci) => {
        const slug = cat.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        const navItem = document.createElement('button');
        navItem.className = 'nav-item';
        navItem.innerHTML = `${cat.name} <span class="nav-count">${cat.items.length}</span>`;
        navItem.onclick = () => {
          const target = document.getElementById(slug);
          if(target){
            target.scrollIntoView({ behavior:'smooth', block:'center' });
            // Highlight
            target.classList.add('highlight');
            setTimeout(() => target.classList.remove('highlight'), 1500);
            // Set active
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navItem.classList.add('active');
          }
        };
        items.appendChild(navItem);
      });
      group.appendChild(items);
      sidebarNav.appendChild(group);
    });
  }
  buildSidebar();

  // ── Build content ──
  const content = document.getElementById('content');

  data.forEach((level, li) => {
    const section = document.createElement('div');
    section.className = 'level-section';
    section.id = `level-${li}`;

    const title = document.createElement('h2');
    title.className = 'level-title';
    title.innerHTML = `<span class="level-badge">${level.level}</span> ${level.title}`;
    section.appendChild(title);

    const desc = document.createElement('p');
    desc.className = 'level-desc';
    desc.textContent = level.desc;
    section.appendChild(desc);

    level.categories.forEach((cat, ci) => {
      const slug = cat.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      const card = document.createElement('div');
      card.className = 'category-card';
      card.id = slug;

      const catName = document.createElement('h3');
      catName.className = 'category-name';
      catName.innerHTML = `${categorySvg} ${cat.name}`;
      card.appendChild(catName);

      const list = document.createElement('ul');
      list.className = 'resource-list';

      cat.items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'resource-item';

        if(item.url){
          const a = document.createElement('a');
          a.className = 'resource-link';
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.innerHTML = `
            <span class="icon">${typeIcons[item.type] || typeIcons.web}</span>
            <span class="resource-info">
              <span class="resource-title">${item.title}</span><br>
              <span class="resource-type ${item.type}">${typeLabels[item.type] || 'LINK'}</span>
            </span>
            <span class="arrow">${arrowSvg}</span>
          `;
          li.appendChild(a);
        } else {
          const div = document.createElement('div');
          div.className = 'book-card';
          div.innerHTML = `
            <span class="icon">${typeIcons.book}</span>
            <span class="resource-info">
              <span class="resource-title">${item.title}</span><br>
              <span class="resource-type book">BOOK</span>
            </span>
          `;
          li.appendChild(div);
        }
        list.appendChild(li);
      });

      card.appendChild(list);
      section.appendChild(card);
    });

    content.appendChild(section);

    // Add divider between levels
    if(li < data.length - 1){
      const hr = document.createElement('hr');
      hr.className = 'level-divider';
      content.appendChild(hr);
    }
  });

  // ── Mobile toggle ──
  const toggleBtn = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  if(toggleBtn){
    toggleBtn.onclick = () => sidebar.classList.toggle('collapsed');
  }

  // ── Scroll spy for active nav ──
  // Build slug-to-navIndex lookup
  const slugToNavIdx = {};
  let navIdx = 0;
  data.forEach(level => {
    level.categories.forEach(cat => {
      const slug = cat.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      slugToNavIdx[slug] = navIdx++;
    });
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const id = entry.target.id;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const idx = slugToNavIdx[id];
        const navItems = document.querySelectorAll('.nav-item');
        if(idx !== undefined && navItems[idx]) navItems[idx].classList.add('active');
      }
    });
  }, { threshold: 0.3 });

  document.querySelectorAll('.category-card').forEach(card => observer.observe(card));

  // ── Scroll to hash anchor on page load ──
  if(window.location.hash){
    setTimeout(() => {
      const target = document.getElementById(window.location.hash.slice(1));
      if(target){
        target.scrollIntoView({ behavior:'smooth', block:'center' });
        target.classList.add('highlight');
        setTimeout(() => target.classList.remove('highlight'), 2000);
      }
    }, 100);
  }

})();
</script>
</body>
</html>
